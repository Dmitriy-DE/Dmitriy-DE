<text x="20" y="140" fill="#8b949e" font-family="monospace" font-size="9.5">estimate ≠ commitment</text>
<text x="20" y="160" fill="#8b949e" font-family="monospace" font-size="9.5">forecast ≠ baseline</text>
</g><g transform="translate(336 118)">
<rect width="252" height="184" rx="18" fill="#111827" stroke="#30363d"/>
<text x="20" y="30" fill="#a371f7" font-family="monospace" font-size="10.5">02</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="15" font-weight="700">CLEAR BOUNDARIES</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="12">put rules where they belong</text>
<line x1="20" y1="112" x2="232" y2="112" stroke="#30363d"/>
<text x="20" y="140" fill="#8b949e" font-family="monospace" font-size="9.5">thin clients</text>
<text x="20" y="160" fill="#8b949e" font-family="monospace" font-size="9.5">services own behaviour</text>
</g><g transform="translate(616 118)">
