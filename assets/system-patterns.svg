<text x="20" y="30" fill="#3fb950" font-family="monospace" font-size="10.5">03</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="15" font-weight="700">BORING OPERATIONS</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="12">prefer simple runtime truth</text>
<line x1="20" y1="112" x2="232" y2="112" stroke="#30363d"/>
<text x="20" y="140" fill="#8b949e" font-family="monospace" font-size="9.5">health · migrations</text>
<text x="20" y="160" fill="#8b949e" font-family="monospace" font-size="9.5">logs · explicit failure</text>
</g><g transform="translate(896 118)">
