<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<rect width="1200" height="340" rx="26" fill="#0d1117" stroke="#30363d"/>
<text x="56" y="58" fill="#f0f6fc" font-family="Arial" font-size="25" font-weight="700">system patterns</text>
<text x="56" y="84" fill="#8b949e" font-family="monospace" font-size="12">recurring decisions I keep making on purpose</text>
<g transform="translate(56 118)">
<rect width="252" height="162" rx="18" fill="#111827" stroke="#30363d"/>
<text x="20" y="30" fill="#58a6ff" font-family="monospace" font-size="11">01</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="16" font-weight="700">DOMAIN CLARITY</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="13">model different facts differently</text>
<text x="20" y="124" fill="#8b949e" font-family="monospace" font-size="10">estimate ≠ commitment · forecast ≠ baseline</text>
</g><g transform="translate(336 118)">
<rect width="252" height="162" rx="18" fill="#111827" stroke="#30363d"/>
<text x="20" y="30" fill="#a371f7" font-family="monospace" font-size="11">02</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="16" font-weight="700">CLEAR BOUNDARIES</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="13">put rules where they belong</text>
<text x="20" y="124" fill="#8b949e" font-family="monospace" font-size="10">clients stay thin · services own behaviour</text>
</g><g transform="translate(616 118)">
<rect width="252" height="162" rx="18" fill="#111827" stroke="#30363d"/>
<text x="20" y="30" fill="#3fb950" font-family="monospace" font-size="11">03</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="16" font-weight="700">BORING OPERATIONS</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="13">prefer simple runtime truth</text>
<text x="20" y="124" fill="#8b949e" font-family="monospace" font-size="10">health · migrations · logs · explicit failure</text>
</g><g transform="translate(896 118)">
<rect width="252" height="162" rx="18" fill="#111827" stroke="#30363d"/>
<text x="20" y="30" fill="#f0883e" font-family="monospace" font-size="11">04</text>
<text x="20" y="60" fill="#f0f6fc" font-family="Arial" font-size="16" font-weight="700">AUTOMATION FIRST</text>
<text x="20" y="92" fill="#c9d1d9" font-family="Arial" font-size="13">remove repeated manual work</text>
<text x="20" y="124" fill="#8b949e" font-family="monospace" font-size="10">scripts · jobs · CI · schedulers</text>
</g>
</svg>