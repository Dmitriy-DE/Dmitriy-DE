<text x="56" y="58" fill="#f0f6fc" font-family="Arial" font-size="25" font-weight="700">system patterns</text>
<text x="56" y="84" fill="#8b949e" font-family="monospace" font-size="11.5">recurring decisions I keep making on purpose</text>
