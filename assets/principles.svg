<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<rect width="1200" height="440" rx="28" fill="#0d1117" stroke="#30363d"/>
<text x="60" y="66" fill="#f0f6fc" font-family="Arial" font-size="26" font-weight="700">how I build</text>
<text x="60" y="96" fill="#8b949e" font-family="monospace" font-size="14">three rules; everything else is implementation detail</text>
<g transform="translate(60 130)">
<rect width="330" height="240" rx="22" fill="#111827" stroke="#30363d"/>
<circle cx="52" cy="52" r="30" fill="#58a6ff" opacity=".15"/><text x="52" y="63" text-anchor="middle" font-size="32">🔨</text>
<text x="32" y="112" fill="#58a6ff" font-family="monospace" font-size="14">01</text>
<text x="32" y="148" fill="#f0f6fc" font-family="Arial" font-size="23" font-weight="700">Use a hammer</text>
<text x="32" y="184" fill="#c9d1d9" font-family="Arial" font-size="15">Do not build a crane</text>
<text x="32" y="207" fill="#c9d1d9" font-family="Arial" font-size="15">for a hammer-sized problem.</text>
</g>
<g transform="translate(435 130)">
<rect width="330" height="240" rx="22" fill="#111827" stroke="#30363d"/>
<circle cx="52" cy="52" r="30" fill="#a371f7" opacity=".15"/><text x="52" y="63" text-anchor="middle" font-size="32">🧩</text>
<text x="32" y="112" fill="#a371f7" font-family="monospace" font-size="14">02</text>
<text x="32" y="148" fill="#f0f6fc" font-family="Arial" font-size="23" font-weight="700">Explain it simply</text>
<text x="32" y="184" fill="#c9d1d9" font-family="Arial" font-size="15">If I cannot explain it to</text>
<text x="32" y="207" fill="#c9d1d9" font-family="Arial" font-size="15">my mum, it is too clever.</text>
</g>
<g transform="translate(810 130)">
<rect width="330" height="240" rx="22" fill="#111827" stroke="#30363d"/>
<circle cx="52" cy="52" r="30" fill="#f0883e" opacity=".15"/><text x="52" y="63" text-anchor="middle" font-size="32">⚙️</text>
<text x="32" y="112" fill="#f0883e" font-family="monospace" font-size="14">03</text>
<text x="32" y="148" fill="#f0f6fc" font-family="Arial" font-size="23" font-weight="700">Automate everything</text>
<text x="32" y="184" fill="#c9d1d9" font-family="Arial" font-size="15">Repeat it twice?</text>
<text x="32" y="207" fill="#c9d1d9" font-family="Arial" font-size="15">It probably wants a script.</text>
</g>
</svg>