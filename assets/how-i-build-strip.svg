<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#f0883e"/></linearGradient></defs>
<rect width="1200" height="190" rx="24" fill="#0d1117" stroke="#30363d"/>
