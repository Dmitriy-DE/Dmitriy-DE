<circle cx="190" cy="54" r="13" fill="#58a6ff"/><circle cx="600" cy="54" r="13" fill="#a371f7"/><circle cx="1010" cy="54" r="13" fill="#f0883e"/>
<text x="190" y="102" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="21" font-weight="700">Like a hammer</text>
<text x="190" y="130" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">simple · direct · hard to misuse</text>
<text x="600" y="102" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="21" font-weight="700">Explain it simply</text>
<text x="600" y="130" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">if mum gets it, the model is probably sane</text>
<text x="1010" y="102" text-anchor="middle" fill="#f0f6fc" font-family="Arial" font-size="21" font-weight="700">Automate everything</text>
<text x="1010" y="130" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">repeatable boring work belongs in code</text>
</svg>